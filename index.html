<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Underwater Fish Catch Game - Wavy Fish Bubbles</title>
<style>
  body { margin:0; background:#ffffff; overflow:hidden; touch-action: none;}
  canvas {
    display:block; margin:0 auto;
    border: 3px solid black;
    background: #00bfff;
    cursor: none;
  }
  #scoreBoard {
    position: absolute;
    top: 10px; left: 50%; transform: translateX(-50%);
    font-family: Arial, sans-serif; font-size: 24px; color: #fff;
    background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 8px;
  }
  #restartBtn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: Arial; font-size: 28px; padding: 12px 25px;
    display: none; background-color: #28a745; color: white;
    border: none; border-radius: 10px; cursor: pointer;
    z-index: 10;
  }
  #restartBtn:hover { background-color: #218838; }
</style>
</head>
<body>
<div id="scoreBoard">Score: 0 | Lives: 5</div>
<button id="restartBtn">Restart Game</button>
<canvas id="gameCanvas" width="900" height="500"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const restartBtn = document.getElementById('restartBtn');

let score, lives, frame, fishArray, gameRunning, particles = [], fishBubbles = [];

// ------------------- Player Net -------------------
const net = {
  x: canvas.width/2,
  y: canvas.height - 50,
  width: 60,
  height: 60,
  draw() {
    ctx.strokeStyle = '#8B4513';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x, this.y + 30);
    ctx.stroke();
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(this.x, this.y, 30, 25, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    for (let i = -25; i <= 25; i += 5) {
      ctx.beginPath();
      ctx.moveTo(this.x - 30, this.y - i);
      ctx.lineTo(this.x + 30, this.y + i);
      ctx.stroke();
    }
    for (let i = -15; i <= 15; i += 5) {
      ctx.beginPath();
      ctx.moveTo(this.x - i, this.y - 25);
      ctx.lineTo(this.x + i, this.y + 25);
      ctx.stroke();
    }
  }
}

// ------------------- Fish Class -------------------
class Fish {
  constructor(){
    this.width = 20 + Math.random()*40;
    this.height = this.width/2;
    this.alive = true;
    this.phase = Math.random() * 20;
    const typeChance = Math.random();
    if(typeChance < 0.7){ this.type='good'; this.color=`hsl(${Math.random()*360},70%,60%)`; this.points=1; }
    else { this.type='bad'; this.color='black'; this.points=-1; }

    const dir = Math.floor(Math.random()*4);
    switch(dir){
      case 0: this.x=-this.width; this.y=Math.random()*(canvas.height-150)+50; this.vx=1+Math.random()*2; this.vy=0; break;
      case 1: this.x=canvas.width; this.y=Math.random()*(canvas.height-150)+50; this.vx=-(1+Math.random()*2); this.vy=0; break;
      case 2: this.x=Math.random()*(canvas.width-50)+25; this.y=-this.height; this.vx=0; this.vy=1+Math.random()*2; break;
      case 3: this.x=Math.random()*(canvas.width-50)+25; this.y=canvas.height; this.vx=0; this.vy=-(1+Math.random()*2); break;
    }
  }

  update(){
    this.x += this.vx;
    this.y += Math.sin(this.phase)*1.5 + this.vy;
    this.phase += 0.05;
    this.draw();

    // Emit wavy bubbles from fish mouth occasionally
    if(this.alive && frame % 10 === 0){
      fishBubbles.push({x: this.x + this.width/2, y: this.y + this.height/2, r: 3+Math.random()*3, alpha: 1, swayPhase: Math.random()*Math.PI*2});
    }

    if(this.x > canvas.width+50 || this.x<-50 || this.y>canvas.height+50 || this.y<-50){
      if(this.alive && this.type==='good') lives--;
      return false;
    }
    return true;
  }

  draw(){
    if(!this.alive) return;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.ellipse(this.x+this.width/2, this.y+this.height/2, this.width/2, this.height/2, 0, 0, 2*Math.PI);
    ctx.fill();

    ctx.fillStyle = this.type==='good'?'orange':'black';
    ctx.beginPath();
    if(this.vx>=0){ ctx.moveTo(this.x,this.y+this.height/2); ctx.lineTo(this.x-10,this.y); ctx.lineTo(this.x-10,this.y+this.height);}
    else if(this.vx<0){ ctx.moveTo(this.x+this.width,this.y+this.height/2); ctx.lineTo(this.x+this.width+10,this.y); ctx.lineTo(this.x+this.width+10,this.y+this.height);}
    else if(this.vy>0){ ctx.moveTo(this.x+this.width/2,this.y); ctx.lineTo(this.x+this.width/2-8,this.y-10); ctx.lineTo(this.x+this.width/2+8,this.y-10);}
    else if(this.vy<0){ ctx.moveTo(this.x+this.width/2,this.y+this.height); ctx.lineTo(this.x+this.width/2-8,this.y+this.height+10); ctx.lineTo(this.x+this.width/2+8,this.y+this.height+10);}
    ctx.closePath();
    ctx.fill();
  }
}

// ------------------- Particle Class -------------------
class Particle {
  constructor(x,y,color){
    this.x=x; this.y=y;
    this.vx=(Math.random()-0.5)*4;
    this.vy=(Math.random()-1.5)*4;
    this.alpha=1;
    this.color=color;
    this.radius=3+Math.random()*3;
  }
  update(){
    this.x+=this.vx; this.y+=this.vy;
    this.alpha-=0.03;
    this.draw();
    return this.alpha>0;
  }
  draw(){
    ctx.globalAlpha=this.alpha;
    ctx.fillStyle=this.color;
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
  }
}

// ------------------- Spawn & Handle Fish -------------------
function spawnFish(){ if(frame % 60 === 0) fishArray.push(new Fish()); }
function handleFish(){ for(let i=fishArray.length-1;i>=0;i--){ const alive=fishArray[i].update(); if(!alive) fishArray.splice(i,1); } }

// ------------------- Handle Particles -------------------
function handleParticles(){ for(let i=particles.length-1;i>=0;i--){ const alive=particles[i].update(); if(!alive) particles.splice(i,1); } }

// ------------------- Handle Fish Bubbles -------------------
function handleFishBubbles(){
  for(let i=fishBubbles.length-1;i>=0;i--){
    const b = fishBubbles[i];
    b.y -= 1 + Math.random()*1.5;
    b.x += Math.sin(frame*0.05 + b.swayPhase)*0.5; // wavy motion
    b.alpha -= 0.02;
    ctx.globalAlpha = b.alpha;
    ctx.fillStyle = 'rgba(173,216,230,0.8)';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r*2, 0, Math.PI*2); // bigger bubble
    ctx.fill();
    ctx.globalAlpha = 1;
    if(b.alpha <= 0) fishBubbles.splice(i,1);
  }
}

// ------------------- Bubbles -------------------
const bubbles = [];
function createBubbles(){
  for(let i=0;i<2;i++){
    const x = 10 + Math.random()*(canvas.width-20);
    const y = canvas.height;
    bubbles.push({x: x, y: y, r: 2+Math.random()*3, speed: 1+Math.random()*1.2});
  }
}

// ------------------- Seaweed -------------------
const seaweed = [];
for(let i=0;i<12;i++){
  seaweed.push({ x: i*75 + 30, height: 50 + Math.random()*50, sway: Math.random()*0.02, phase: Math.random()*Math.PI*2 });
}
function drawSeaweed(){ seaweed.forEach(s=>{ s.phase += s.sway; const swayX=Math.sin(s.phase)*10; ctx.strokeStyle='#006400'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(s.x, canvas.height); ctx.quadraticCurveTo(s.x+swayX, canvas.height-s.height/2, s.x, canvas.height-s.height); ctx.stroke(); }); }

// ------------------- Light Rays -------------------
function drawLightRays(){ for(let i=0;i<5;i++){ const startX=i*180+50+Math.sin(frame*0.02+i)*20; ctx.strokeStyle='rgba(255,255,224,0.05)'; ctx.lineWidth=20; ctx.beginPath(); ctx.moveTo(startX,0); ctx.lineTo(startX,canvas.height); ctx.stroke(); } }

// ------------------- Background -------------------
function drawBackground(){
  drawLightRays();
  drawSeaweed();
  createBubbles();
  bubbles.forEach((b,i)=>{ b.y -= b.speed; if(b.y<0) bubbles.splice(i,1); ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill(); });
}

// ------------------- Collision Detection -------------------
function checkCatch(){
  for(let i=fishArray.length-1;i>=0;i--){
    const f=fishArray[i];
    if(f.alive &&
       net.x + net.width/2 > f.x &&
       net.x - net.width/2 < f.x + f.width &&
       net.y + net.height/2 > f.y &&
       net.y - net.height/2 < f.y + f.height){
      f.alive=false;
      score += f.points;
      if(f.type==='bad') lives--;
      for(let p=0;p<15;p++) particles.push(new Particle(f.x+f.width/2, f.y+f.height/2, f.color));
    }
  }
}

// ------------------- Scoreboard -------------------
function updateScoreBoard(){ document.getElementById('scoreBoard').textContent = `Score: ${score} | Lives: ${lives}`; }

// ------------------- Game Over -------------------
function showGameOver(){
  gameRunning = false; restartBtn.style.display='block';
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = 'white'; ctx.font = '48px Arial'; ctx.textAlign = 'center';
  ctx.fillText('Game Over', canvas.width/2, canvas.height/2 - 50);
  ctx.font = '32px Arial'; ctx.fillText(`Final Score: ${score}`, canvas.width/2, canvas.height/2);
}

// ------------------- Main Game Loop -------------------
function update(){
  if(!gameRunning) return;
  frame++;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawBackground();
  spawnFish();
  handleFish();
  handleParticles();
  handleFishBubbles();
  net.draw();
  checkCatch();
  updateScoreBoard();

  if(lives>0) requestAnimationFrame(update);
  else showGameOver();
}

// ------------------- Mouse Control -------------------
canvas.addEventListener('mousemove', e=>{
  const rect = canvas.getBoundingClientRect();
  net.x = e.clientX - rect.left;
  net.y = e.clientY - rect.top;
});
// ------------------- Touch Control (Mobile Support) -------------------
canvas.addEventListener('touchstart', handleTouch, { passive: false });
canvas.addEventListener('touchmove', handleTouch, { passive: false });

function handleTouch(e){
  e.preventDefault(); // stop page scrolling
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];

  net.x = touch.clientX - rect.left;
  net.y = touch.clientY - rect.top;
}


// ------------------- Restart Button -------------------
restartBtn.addEventListener('click', ()=>{ initGame(); });

// ------------------- Start Game -------------------
function initGame(){ score=0; lives=5; frame=0; fishArray=[]; particles=[]; fishBubbles=[]; gameRunning=true; restartBtn.style.display='none'; updateScoreBoard(); update(); }

initGame();
</script>
</body>
</html>
